custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include="<meta name=\"apple-mobile-web-app-capable\" content=\"yes\"><meta name=\"mobile-web-app-capable\" content=\"yes\"><meta name=\"theme-color\" content=\"#07060f\"><style>:root{--sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom);--sal:env(safe-area-inset-left);--sar:env(safe-area-inset-right);}html,body{background:#07060f;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}#rotate-hint{display:none;position:fixed;inset:0;z-index:99;background:#07060f;color:#e4e2f4;font:16px sans-serif;align-items:center;justify-content:center;text-align:center;line-height:1.8;}@media (orientation:portrait) and (max-width:900px){#rotate-hint{display:flex;}}</style><script>document.addEventListener(\"DOMContentLoaded\",function(){var d=document.createElement(\"div\");d.id=\"rotate-hint\";d.innerHTML=\"<div>📱↻<br>横画面にしてください<br><small>Please rotate your device</small></div>\";document.body.appendChild(d);});</script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=true
progressive_web_app/ensure_cross_origin_isolation_headers=false
progressive_web_app/offline_page=""
progressive_web_app/display=1
progressive_web_app/orientation=1
progressive_web_app/icon_144x144="res://assets/icons/icon_144.png"
progressive_web_app/icon_180x180="res://assets/icons/icon_180.png"
progressive_web_app/icon_512x512="res://assets/icons/icon_512.png"
progressive_web_app/background_color=Color(0.027, 0.024, 0.059, 1)
